name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Tools used by the test suite (rg, tmux, python3, git are preinstalled or cheap)
        run: sudo apt-get update && sudo apt-get install -y ripgrep tmux
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run bundle
      - name: Smoke-test the bundle
        run: node dist/revcode.mjs --version && node dist/revcode.mjs --help > /dev/null
