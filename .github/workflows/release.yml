name: Release

# Publish a release (or push a tag like v0.1.0) and this builds dist/revcode.mjs and attaches it.
# install.sh downloads that file, so users never need to build anything.
on:
  push:
    tags: ["v*"]
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run bundle
      - name: Smoke-test the bundle
        run: node dist/revcode.mjs --version && node dist/revcode.mjs --help > /dev/null
      - name: Attach the build to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/revcode.mjs --clobber
          else
            gh release create "$TAG" dist/revcode.mjs \
              --title "RevCode $TAG" \
              --notes "Install or update: \`curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/master/install.sh | sh\`"
          fi
